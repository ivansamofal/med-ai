[project]
name = "med-ai"
version = "0.1.0"
description = "MedAI — Clinical Lab Intelligence & Care Coordination Platform"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "motor>=3.6",
    "pymongo>=4.9",
    "boto3>=1.35",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "structlog>=24.4",
    "llama-index-core>=0.11",
    "llama-index-readers-file>=0.2",
    "llama-index-vector-stores-chroma>=0.2",
    "llama-index-vector-stores-mongodb>=0.2",
    "fastembed>=0.4",
    "chromadb>=0.5",
    "langchain-core>=0.3",
    "langchain-aws>=0.2",
    "langgraph>=0.6",
    "langgraph-checkpoint-mongodb>=0.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "fpdf2>=2.7",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
